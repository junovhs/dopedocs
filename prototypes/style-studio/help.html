<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Center · Halcyon Duo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="kit.css">
<style>
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  header.top { position: sticky; top: 0; z-index: 50; }
  header.top .wrap { height: 64px; display: flex; align-items: center; gap: 22px; }
  header.top .logo small { font: 500 14px var(--dd-sans); color: var(--dd-muted); letter-spacing: 0; margin-left: 2px; }
  .mm-trigger { display: inline-flex; gap: 6px; align-items: center; height: 34px; padding: 0 12px; border-radius: 999px; font: 500 13.5px var(--dd-sans); color: var(--dd-text-soft); transition: all .15s; }
  .mm-trigger:hover, .mm-open .mm-trigger { background: var(--dd-panel-muted); color: var(--dd-text); }
  .mm-trigger .ico { width: 14px; height: 14px; transition: transform .25s; } .mm-open .mm-trigger .ico { transform: rotate(180deg); }
  .top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .mini-search { display: none; }
  .has-scrolled .mini-search { display: flex; }
  .mega { position: absolute; left: 0; right: 0; top: 100%; background: var(--dd-panel); border-bottom: 1px solid var(--dd-line); box-shadow: var(--dd-shadow-lg); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: all .25s var(--dd-ease); }
  .mm-open .mega { opacity: 1; transform: none; pointer-events: auto; }
  .mega .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; padding-top: 28px; padding-bottom: 30px; }
  .mega h5 { margin: 0 0 4px; display: flex; gap: 8px; align-items: center; font: 600 14px var(--dd-sans); color: var(--dd-text); }
  .mega h5 .ico { color: var(--dd-accent); }
  .mega p { margin: 0 0 12px; font-size: 12.5px; color: var(--dd-muted); line-height: 1.45; }
  .mega a { display: block; padding: 5px 0; font-size: 13.5px; color: var(--dd-text-soft); text-decoration: none; transition: color .15s, transform .15s; }
  .mega a:hover { color: var(--dd-accent); transform: translateX(2px); }

  .hero { position: relative; z-index: 2; overflow-x: clip; padding: 84px 0 72px; text-align: center; border-bottom: 1px solid var(--dd-line-soft); }
  .hero::before { content: ""; position: absolute; inset: -40% -10% auto; height: 140%; z-index: -1;
    background: radial-gradient(40% 50% at 25% 30%, color-mix(in oklab, var(--dd-accent) 22%, transparent), transparent 70%),
                radial-gradient(35% 45% at 78% 20%, color-mix(in oklab, var(--dd-accent) 14%, #ffb86b 10%), transparent 70%),
                radial-gradient(50% 50% at 50% 100%, var(--dd-panel-muted), transparent 70%); filter: blur(10px); animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(3%, 4%) scale(1.06); } }
  .hero .grid-bg { position: absolute; inset: 0; z-index: -1; opacity: .5; background-image: linear-gradient(var(--dd-line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--dd-line-soft) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(60% 70% at 50% 40%, #000, transparent); }
  .hero h1 { font-size: calc(clamp(36px, 6vw, 60px) * var(--dd-head-scale)); line-height: 1.02; margin: 14px 0 12px; }
  .hero .sub { color: var(--dd-text-soft); font-size: 17px; margin: 0 auto 32px; max-width: 520px; }
  .bigsearch { position: relative; z-index: 3; max-width: 620px; margin: 0 auto; text-align: left; }
  .bigsearch .box { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 10px 0 20px; border-radius: calc(var(--dd-radius) + 6px); background: var(--dd-panel); border: 1px solid var(--dd-line); box-shadow: var(--dd-shadow-lg); transition: border-color .2s, box-shadow .2s; }
  .bigsearch .box:focus-within { border-color: var(--dd-accent-line); box-shadow: var(--dd-shadow-lg), 0 0 0 4px var(--dd-accent-soft); }
  .bigsearch .box > .ico { width: 20px; height: 20px; color: var(--dd-muted); }
  .bigsearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 17px var(--dd-sans); color: var(--dd-text); }
  .bigsearch input::placeholder { color: var(--dd-muted); }
  .bigsearch .box .btn { height: 40px; }
  .ta { position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 8px); padding: 6px; border-radius: calc(var(--dd-radius) + 4px); background: var(--dd-panel); border: 1px solid var(--dd-line); box-shadow: var(--dd-shadow-lg); display: none; }
  .ta.open { display: block; animation: dd-in .2s var(--dd-ease); }
  .ta a { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: calc(var(--dd-radius) - 2px); text-decoration: none; }
  .ta a .ico { color: var(--dd-muted); margin-top: 3px; }
  .ta a b { display: block; color: var(--dd-text); font-weight: 550; font-size: 14.5px; } .ta a small { color: var(--dd-muted); font-size: 12.5px; }
  .ta a mark { background: none; color: var(--dd-accent); font-weight: 650; }
  .ta a.sel { background: var(--dd-accent-soft); }
  .ta .none { padding: 16px; color: var(--dd-muted); font-size: 14px; }
  .pop { margin-top: 18px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: 13px; color: var(--dd-muted); align-items: center; }
  .chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--dd-line); background: var(--dd-panel); font: 500 13px var(--dd-sans); color: var(--dd-text-soft); transition: all .2s var(--dd-ease); display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { border-color: var(--dd-accent-line); color: var(--dd-text); }
  .chip[aria-pressed="true"] { background: var(--dd-text); color: var(--dd-bg); border-color: transparent; }
  .chip .n { font-size: 11px; opacity: .6; }

  section.block { padding: 64px 0 8px; }
  .sh { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .sh h2 { margin: 0; font-size: 26px; }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
  .cat { display: flex; flex-direction: column; padding: 22px; border-radius: calc(var(--dd-radius) + 4px); background: var(--dd-panel); border: 1px solid var(--dd-line); text-decoration: none; transition: all .3s var(--dd-ease); position: relative; overflow: hidden; }
  .cat::after { content: ""; position: absolute; inset: auto -30% -60% auto; width: 200px; height: 200px; border-radius: 50%; background: var(--dd-accent-soft); opacity: 0; transform: scale(.6); transition: all .5s var(--dd-ease); }
  .cat:hover { transform: translateY(-3px); box-shadow: var(--dd-shadow-lg); border-color: var(--dd-accent-line); }
  .cat:hover::after { opacity: 1; transform: none; }
  .cat .tile { width: 44px; height: 44px; border-radius: calc(var(--dd-radius) * .8 + 2px); display: grid; place-items: center; background: var(--dd-accent-soft); color: var(--dd-accent); margin-bottom: 18px; transition: transform .4s var(--dd-spring); }
  .cat:hover .tile { transform: rotate(-8deg) scale(1.08); }
  .cat .tile .ico { width: 22px; height: 22px; }
  .cat h3 { margin: 0 0 4px; font-size: 18px; } .cat p { margin: 0 0 16px; color: var(--dd-text-soft); font-size: 14px; }
  .cat ul { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 7px; font-size: 13.5px; color: var(--dd-text-soft); position: relative; z-index: 1; }
  .cat ul li { display: flex; gap: 8px; } .cat ul .ico { width: 14px; height: 14px; color: var(--dd-muted); margin-top: 3px; }
  .cat .more { margin-top: auto; font: 550 13px var(--dd-sans); color: var(--dd-accent); display: flex; gap: 6px; align-items: center; position: relative; z-index: 1; }
  .cat .more .ico { width: 14px; height: 14px; transition: transform .2s; } .cat:hover .more .ico { transform: translateX(3px); }
  .qs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
  .qs a { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 16px 2px; border-bottom: 1px solid var(--dd-line-soft); text-decoration: none; color: var(--dd-text); font: 500 15px var(--dd-sans); transition: color .15s; animation: dd-in .35s var(--dd-ease) both; }
  .qs a small { color: var(--dd-muted); font-weight: 400; font-size: 12px; white-space: nowrap; }
  .qs a:hover { color: var(--dd-accent); }
  .stuck { margin: 64px 0 80px; display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 30px 32px; border-radius: calc(var(--dd-radius) + 6px); background: var(--dd-ink); color: var(--dd-on-ink); position: relative; overflow: hidden; }
  [data-mode="dark"] .stuck { background: var(--dd-panel-muted); color: var(--dd-text); }
  .stuck::before { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(var(--dd-accent), transparent 70%); opacity: .35; }
  .stuck h3 { margin: 0 0 4px; font-size: 22px; color: inherit; } .stuck p { margin: 0; opacity: .75; }
  .stuck .btn { position: relative; height: 42px; }

  .art { display: grid; grid-template-columns: minmax(0, var(--dd-measure)) 280px; grid-template-areas: "a r"; justify-content: space-between; gap: 56px; padding: 36px 0 90px; }
  .art > article { grid-area: a; min-width: 0; } .art > .rail { grid-area: r; }
  [data-toc="left"] .art { grid-template-columns: 280px minmax(0, var(--dd-measure)); grid-template-areas: "r a"; }
  [data-toc="off"] .art { grid-template-columns: minmax(0, var(--dd-measure)); grid-template-areas: "a"; justify-content: center; } [data-toc="off"] .rail { display: none; }
  .crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--dd-muted); margin-bottom: 26px; }
  .crumbs a { text-decoration: none; } .crumbs a:hover { color: var(--dd-text); } .crumbs .ico { width: 13px; height: 13px; opacity: .5; }
  .art h1 { font-size: calc(clamp(28px, 4vw, 40px) * var(--dd-head-scale)); line-height: 1.12; margin: 10px 0 16px; }
  .art .answer { margin: 28px 0 36px; }
  .art .after { margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--dd-line); }
  .related { margin-top: 40px; } .related h4, .rail h4 { margin: 0 0 12px; font: 600 12px var(--dd-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--dd-muted); }
  .related .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .related a { padding: 16px; border-radius: var(--dd-radius); border: 1px solid var(--dd-line); background: var(--dd-panel); text-decoration: none; transition: all .2s var(--dd-ease); }
  .related a:hover { border-color: var(--dd-accent-line); transform: translateY(-2px); box-shadow: var(--dd-shadow); }
  .related a small { color: var(--dd-accent); font: 600 11px var(--dd-sans); letter-spacing: .06em; text-transform: uppercase; }
  .related a b { display: block; color: var(--dd-text); font: 550 14.5px/1.35 var(--dd-sans); margin-top: 6px; }
  .rail { position: sticky; top: 96px; align-self: start; display: grid; gap: 28px; }
  .rail .list a { display: block; padding: 8px 12px; margin-left: -12px; border-radius: 8px; color: var(--dd-text-soft); text-decoration: none; font-size: 14px; line-height: 1.4; transition: all .15s; }
  .rail .list a:hover { background: var(--dd-panel-muted); color: var(--dd-text); }

  .contact { padding: 18px; border-radius: var(--dd-radius); background: var(--dd-panel-muted); font-size: 13.5px; }
  .contact b { display: block; color: var(--dd-text); margin-bottom: 4px; } .contact .btn { margin-top: 12px; width: 100%; justify-content: center; }
  .back { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--dd-muted); text-decoration: none; margin-bottom: 18px; } .back:hover { color: var(--dd-text); }

  @media (max-width: 900px) {
    .mega .wrap { grid-template-columns: 1fr 1fr; } .art, [data-toc="left"] .art { grid-template-columns: 1fr; grid-template-areas: "a" "r"; gap: 32px; } .rail { position: static; } .qs { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 0 16px; } header.top .wrap { gap: 10px; } .top .right .btn span.lbl { display: none; } .logo small { display: none; }
    .hero { padding: 52px 0 48px; } .hero .sub { font-size: 15px; } .bigsearch .box { height: 54px; padding-left: 16px; } .bigsearch .box .btn { display: none; }
    .related .grid { grid-template-columns: 1fr; } .mega .wrap { grid-template-columns: 1fr; max-height: 70dvh; overflow: auto; } .stuck { padding: 24px; }
  }
</style>
</head>
<body>
<header class="top dd-header" id="top">
  <div class="wrap">
    <a class="logo" href="#"><span class="logo-mark"><span data-i="cup"></span></span>Halcyon <small>Help Center</small></a>
    <button class="mm-trigger" id="mmt" aria-expanded="false">Browse topics <span data-i="chevd"></span></button>
    <div class="right">
      <button class="icon-btn mini-search" data-w="search" id="ms" aria-label="Search"><span data-i="search"></span></button>
      <button class="btn" onclick="DDKit.toast('Opens your support channel','msg')"><span data-i="msg"></span><span class="lbl">Contact support</span></button>
      <button class="icon-btn" id="mode" aria-label="Toggle dark mode"></button>
    </div>
  </div>
  <div class="mega" id="mega"><div class="wrap" id="megaw"></div></div>
</header>
<div id="view"></div>
<script src="content.js"></script>
<script src="skins.js"></script>
<script src="kit.js"></script>
<script>
const K = DDKit, { D, flat, byId, icon, inline, esc, $, $$ } = K;
$$("[data-i]").forEach(el => el.outerHTML = icon(el.dataset.i));
const modeBtn = $("#mode"); const mi = () => modeBtn.innerHTML = icon(document.documentElement.dataset.mode === "dark" ? "sun" : "moon");
K.onSettings(mi); mi(); modeBtn.onclick = K.toggleMode; $("#ms").onclick = () => K.openPalette();

// Mega menu
$("#megaw").innerHTML = D.chapters.map(c => `<div><h5>${icon(c.icon)}${esc(c.title)}</h5><p>${esc(c.blurb)}</p>${c.sections.map(s => `<a href="#${s.id}">${esc(s.title)}</a>`).join("")}</div>`).join("");
const topEl = $("#top"); let mmT;
const mm = on => { topEl.classList.toggle("mm-open", on); $("#mmt").setAttribute("aria-expanded", on); };
$("#mmt").onclick = () => mm(!topEl.classList.contains("mm-open"));
$("#mmt").onmouseenter = () => { clearTimeout(mmT); mm(true); };
topEl.onmouseleave = () => { mmT = setTimeout(() => mm(false), 200); };
$("#mega").onmouseenter = () => clearTimeout(mmT);
addEventListener("keydown", e => e.key === "Escape" && mm(false));

const hi = (t, ws) => { let h = esc(t); ws.forEach(w => w && (h = h.replace(new RegExp("(" + w.replace(/[^\w]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"))); return h; };
const norm = t => t.toLowerCase();

function home() {
  document.title = "Help Center · Halcyon";
  $("#view").innerHTML = `<section class="hero"><div class="grid-bg"></div><div class="wrap enter">
      <div class="eyebrow">Halcyon Duo · Help Center</div>
      <h1 class="display">How can we help?</h1>
      <p class="sub">Answers for every part of your Duo, from the first shot to the fiftieth descale.</p>
      <div class="bigsearch" data-w="search"><div class="box">${icon("search")}<input id="q" placeholder="Ask a question — “why no steam?”" autocomplete="off" aria-label="Search help" /><button class="btn primary" id="qgo">Search</button></div><div class="ta" id="ta" role="listbox"></div></div>
      <div class="pop"><span>Popular:</span>${["descale", "E3", "oat milk", "pairing", "grind"].map(p => `<button class="chip" data-pop="${p}">${p}</button>`).join("")}</div>
    </div></section>
    <div class="wrap">
      <section class="block"><div class="sh"><h2 class="display">Browse by topic</h2><span class="meta">${flat.length} articles · updated weekly</span></div>
        <div class="cats">${D.chapters.map(c => `<a class="cat" href="#${c.sections[0].id}"><span class="tile">${icon(c.icon)}</span><h3 class="display">${esc(c.title)}</h3><p>${esc(c.blurb)}</p><ul>${c.sections.slice(0, 3).map(s => `<li>${icon("doc")}${esc(s.question)}</li>`).join("")}</ul><span class="more">${c.sections.length} articles ${icon("right")}</span></a>`).join("")}</div></section>
      <section class="block"><div class="sh"><h2 class="display">Questions people ask</h2>
        <div class="pop" style="margin:0;justify-content:flex-start" id="facets"><button class="chip" aria-pressed="true" data-f="">All <span class="n">${flat.length}</span></button>${D.chapters.map(c => `<button class="chip" data-f="${c.id}">${esc(c.title)} <span class="n">${c.sections.length}</span></button>`).join("")}</div></div>
        <div class="qs" id="qs"></div></section>
      <div class="stuck"><div><h3 class="display">Still stuck?</h3><p>Real humans who own a Duo, answering within a day.</p></div><button class="btn primary" onclick="DDKit.toast('Opens your support channel','msg')">${icon("msg")} Talk to support</button></div>
    </div>`;
  const qs = f => { $("#qs").innerHTML = flat.filter(s => !f || s.chapter.id === f).map((s, i) => `<a href="#${s.id}" style="animation-delay:${i * 25}ms">${esc(s.question)}<small>${esc(s.chapter.title)}</small></a>`).join(""); };
  qs("");
  $$("#facets .chip").forEach(b => b.onclick = () => { $$("#facets .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); qs(b.dataset.f); });
  const q = $("#q"), ta = $("#ta"); let sel = 0, res = [];
  const fill = () => {
    const ws = norm(q.value).split(/\s+/).filter(Boolean);
    if (!ws.length) { ta.classList.remove("open"); return; }
    res = flat.filter(s => { const h = norm([s.title, s.question, K.plain(s.answer), s.blocks.map(b => K.plain(b.text || (b.items || []).join(" ") || (b.rows || []).flat().join(" "))).join(" ")].join(" ")); return ws.every(w => h.includes(w)); }).map(s => [s, ws.filter(w => norm(s.question + " " + s.title).includes(w)).length]).sort((a, b) => b[1] - a[1]).map(x => x[0]).slice(0, 6);
    sel = 0;
    ta.innerHTML = res.length ? res.map((s, i) => `<a href="#${s.id}" class="${i === 0 ? "sel" : ""}">${icon("msg")}<span><b>${hi(s.question, ws)}</b><small>${esc(s.chapter.title)} · ${hi(K.plain(s.answer).slice(0, 90), ws)}…</small></span></a>`).join("") : `<div class="none">No answers for “${esc(q.value)}” yet — <a href="#codes" style="color:var(--dd-accent)">try troubleshooting</a>.</div>`;
    ta.classList.add("open");
  };
  q.addEventListener("input", fill);
  q.addEventListener("keydown", e => {
    const as = $$("a", ta);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + as.length) % as.length; as.forEach((a, i) => a.classList.toggle("sel", i === sel)); }
    if (e.key === "Enter" && res[sel]) location.hash = res[sel].id;
    if (e.key === "Escape") ta.classList.remove("open");
  });
  q.addEventListener("blur", () => setTimeout(() => ta.classList.remove("open"), 150));
  $("#qgo").onclick = () => res[0] ? (location.hash = res[0].id) : fill();
  $$("[data-pop]").forEach(b => b.onclick = () => { q.value = b.dataset.pop; q.focus(); fill(); });
}
function article(s) {
  document.title = s.question + " · Halcyon Help";
  const rel = [...new Set([...s.blocks.flatMap(b => [...JSON.stringify(b).matchAll(/\(#([\w-]+)\)/g)].map(m => m[1])), ...s.chapter.sections.map(x => x.id)])].filter(id => id !== s.id && byId[id]).slice(0, 4).map(id => byId[id]);
  $("#view").innerHTML = `<div class="wrap"><div class="art enter"><article>
      <nav class="crumbs" data-w="breadcrumbs"><a href="#">Help Center</a>${icon("chev")}<a href="#${s.chapter.sections[0].id}">${esc(s.chapter.title)}</a>${icon("chev")}<span>${esc(s.title)}</span></nav>
      <div class="eyebrow">${esc(s.chapter.title)}</div>
      <h1 class="display">${esc(s.question)}</h1>
      <div class="meta"><span>${icon("clock")} ${s.min} min read</span><span>Updated 18 Oct 2026</span><span>${icon("check")} Verified for ${D.entity.version}</span></div>
      <div class="answer" data-w="answer"><div class="q">${icon("bolt")} Short answer</div>${inline(s.answer)}</div>
      <div class="prose">${K.render(s)}</div>
      <div class="after">${K.feedback()}</div>
      <div class="related" data-w="pager"><h4>Related questions</h4><div class="grid">${rel.map(r => `<a href="#${r.id}"><small>${esc(r.chapter.title)}</small><b>${esc(r.question)}</b></a>`).join("")}</div></div>
    </article>
    <aside class="rail"><div data-w="toc"><h4>In ${esc(s.chapter.title)}</h4><div class="list">${s.chapter.sections.map(x => `<a href="#${x.id}" class="dd-item ${x === s ? "on" : ""}" aria-current="${x === s ? "page" : "false"}">${esc(x.question)}</a>`).join("")}</div></div>
      <div class="contact"><b>Didn't solve it?</b>Send us your shot photo and the code on screen — it speeds things up.<button class="btn" onclick="DDKit.toast('Opens your support channel','msg')">${icon("msg")} Contact support</button></div></aside>
  </div></div>`;
}
function route() {
  mm(false);
  const id = location.hash.slice(1);
  byId[id] ? article(byId[id]) : home();
  document.body.classList.toggle("has-scrolled", !!byId[id]);
  scrollTo({ top: 0, behavior: "instant" });
}
addEventListener("hashchange", route);
addEventListener("scroll", () => document.body.classList.toggle("has-scrolled", scrollY > 300 || !!byId[location.hash.slice(1)]), { passive: true });
K.go = id => { location.hash = id; };
route();
document.body.classList.toggle("has-scrolled", !!byId[location.hash.slice(1)]);
</script>
</body>
</html>
